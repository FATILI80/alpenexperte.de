<style>.aff40{max-width:1100px;margin:56px auto;padding:32px 20px;background:linear-gradient(135deg,#1f2a20,#2e3d2f);border-radius:20px;color:#e8e2d6}.aff40-badge{display:inline-block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:6px;margin-bottom:14px}.aff40-head{color:#fff;font-family:var(--font-display);font-size:clamp(1.3rem,3vw,1.9rem);margin:0 0 8px}.aff40-sub{color:rgba(255,255,255,.8);margin:0 0 24px;max-width:720px;line-height:1.5}.aff-group{margin-bottom:22px}.aff-group-title{color:#c9d4c9;font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px}.aff-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.aff-tile{display:flex;flex-direction:column;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:18px;text-decoration:none;color:#f0ece2;transition:transform .2s,background .2s}.aff-tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}.aff-tile-emoji{font-size:1.7rem;margin-bottom:8px}.aff-tile-title{font-weight:700;margin-bottom:4px}.aff-tile-desc{font-size:.82rem;color:rgba(255,255,255,.7);flex:1;line-height:1.4}.aff-tile-cta{margin-top:12px;color:#e8b86d;font-weight:600;font-size:.85rem}.aff40-all{display:inline-block;background:#c2722d;color:#fff;padding:12px 26px;border-radius:30px;text-decoration:none;font-weight:600}.aff40-all:hover{background:#a85f22}</style>
